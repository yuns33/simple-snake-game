<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>贪吃蛇小游戏</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #e0e0e0;
      overflow: hidden;
      touch-action: none;
    }
    h1 {
      font-size: 1.9rem;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #00f5a0, #00d9f5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 2px;
    }
    .score-board {
      display: flex;
      gap: 24px;
      margin-bottom: 14px;
      font-size: 1.15rem;
    }
    .score-board span {
      background: rgba(255,255,255,0.08);
      padding: 8px 18px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
    }
    #gameCanvas {
      background: #0a0a12;
      border: 3px solid #00f5a0;
      border-radius: 10px;
      box-shadow: 0 0 30px rgba(0,245,160,0.25), inset 0 0 40px rgba(0,0,0,0.5);
      max-width: min(92vw, 420px);
      max-height: min(70vh, 420px);
    }
    .controls {
      margin-top: 14px;
      text-align: center;
      opacity: 0.7;
      font-size: 0.88rem;
      line-height: 1.5;
    }
    .btn {
      margin-top: 14px;
      padding: 12px 32px;
      font-size: 1.05rem;
      background: linear-gradient(90deg, #00f5a0, #00d9f5);
      color: #0a0a12;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 1px;
      transition: transform 0.12s, box-shadow 0.12s;
      box-shadow: 0 4px 15px rgba(0,245,160,0.35);
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,245,160,0.45); }
    .btn:active { transform: scale(0.96); }
    .game-over {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(10,10,20,0.95);
      padding: 32px 44px;
      border-radius: 16px;
      text-align: center;
      display: none;
      border: 2px solid #ff4d6d;
      box-shadow: 0 0 40px rgba(255,77,109,0.3);
      z-index: 10;
    }
    .game-over h2 {
      color: #ff4d6d;
      margin-bottom: 12px;
      font-size: 1.6rem;
    }
    .game-over p { margin-bottom: 18px; font-size: 1.1rem; }
  </style>
</head>
<body>
  <h1>贪吃蛇</h1>
  <div class="score-board">
    <span>得分 <strong id="score">0</strong></span>
    <span>最高 <strong id="highScore">0</strong></span>
  </div>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <div class="controls">
    方向键 / WASD 控制移动<br>
    手机滑动屏幕操作
  </div>
  <button class="btn" id="startBtn">开始游戏</button>

  <div class="game-over" id="gameOver">
    <h2>游戏结束</h2>
    <p>最终得分：<strong id="finalScore">0</strong></p>
    <button class="btn" id="restartBtn">再来一局</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    let snake = [{x: 10, y: 10}];
    let food = {x: 15, y: 15};
    let dx = 0;
    let dy = 0;
    let score = 0;
    let highScore = parseInt(localStorage.getItem('snakeHighScore') || '0', 10);
    let gameRunning = false;
    let gameLoop = null;

    document.getElementById('highScore').textContent = highScore;

    function draw() {
      ctx.fillStyle = '#0a0a12';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(0,245,160,0.06)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= tileCount; i++) {
        ctx.beginPath();
        ctx.moveTo(i * gridSize, 0);
        ctx.lineTo(i * gridSize, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * gridSize);
        ctx.lineTo(canvas.width, i * gridSize);
        ctx.stroke();
      }

      snake.forEach((segment, index) => {
        const isHead = index === 0;
        ctx.fillStyle = isHead ? '#00f5a0' : `hsl(160, 90%, ${45 + Math.min(index * 1.5, 25)}%)`;
        const x = segment.x * gridSize;
        const y = segment.y * gridSize;
        const size = gridSize - 2;
        const r = 5;
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + size - r, y);
        ctx.quadraticCurveTo(x + size, y, x + size, y + r);
        ctx.lineTo(x + size, y + size - r);
        ctx.quadraticCurveTo(x + size, y + size, x + size - r, y + size);
        ctx.lineTo(x + r, y + size);
        ctx.quadraticCurveTo(x, y + size, x, y + size - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
        ctx.fill();

        if (isHead) {
          ctx.fillStyle = '#0a0a12';
          const eyeSize = 3;
          if (dx === 1) {
            ctx.beginPath(); ctx.arc(x + size - 6, y + 6, eyeSize, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x + size - 6, y + size - 6, eyeSize, 0, Math.PI*2); ctx.fill();
          } else if (dx === -1) {
            ctx.beginPath(); ctx.arc(x + 6, y + 6, eyeSize, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x + 6, y + size - 6, eyeSize, 0, Math.PI*2); ctx.fill();
          } else if (dy === -1) {
            ctx.beginPath(); ctx.arc(x + 6, y + 6, eyeSize, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x + size - 6, y + 6, eyeSize, 0, Math.PI*2); ctx.fill();
          } else {
            ctx.beginPath(); ctx.arc(x + 6, y + size - 6, eyeSize, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x + size - 6, y + size - 6, eyeSize, 0, Math.PI*2); ctx.fill();
          }
        }
      });

      const fx = food.x * gridSize + gridSize / 2;
      const fy = food.y * gridSize + gridSize / 2;
      const gradient = ctx.createRadialGradient(fx, fy, 2, fx, fy, gridSize / 2);
      gradient.addColorStop(0, '#ff6b8a');
      gradient.addColorStop(1, '#ff2d55');
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(fx, fy, gridSize / 2 - 2, 0, Math.PI * 2);
      ctx.fill();
    }

    function move() {
      if (!gameRunning) return;

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        endGame();
        return;
      }

      for (let i = 0; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
          endGame();
          return;
        }
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById('score').textContent = score;
        if (score > highScore) {
          highScore = score;
          localStorage.setItem('snakeHighScore', highScore);
          document.getElementById('highScore').textContent = highScore;
        }
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function placeFood() {
      let valid = false;
      while (!valid) {
        food = {
          x: Math.floor(Math.random() * tileCount),
          y: Math.floor(Math.random() * tileCount)
        };
        valid = true;
        for (const segment of snake) {
          if (food.x === segment.x && food.y === segment.y) {
            valid = false;
            break;
          }
        }
      }
    }

    function endGame() {
      gameRunning = false;
      if (gameLoop) clearInterval(gameLoop);
      document.getElementById('finalScore').textContent = score;
      document.getElementById('gameOver').style.display = 'block';
    }

    function startGame() {
      snake = [{x: 10, y: 10}];
      dx = 0;
      dy = 0;
      score = 0;
      document.getElementById('score').textContent = '0';
      document.getElementById('gameOver').style.display = 'none';
      placeFood();
      gameRunning = true;
      draw();
      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(move, 110);
    }

    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('restartBtn').addEventListener('click', startGame);

    document.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      if (!gameRunning && (['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(key))) {
        startGame();
      }
      if (key === 'arrowup' || key === 'w') {
        if (dy === 0) { dx = 0; dy = -1; }
      } else if (key === 'arrowdown' || key === 's') {
        if (dy === 0) { dx = 0; dy = 1; }
      } else if (key === 'arrowleft' || key === 'a') {
        if (dx === 0) { dx = -1; dy = 0; }
      } else if (key === 'arrowright' || key === 'd') {
        if (dx === 0) { dx = 1; dy = 0; }
      }
    });

    let touchStartX = 0;
    let touchStartY = 0;
    canvas.addEventListener('touchstart', (e) => {
      const t = e.touches[0];
      touchStartX = t.clientX;
      touchStartY = t.clientY;
      e.preventDefault();
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
      if (!gameRunning) startGame();
      const t = e.changedTouches[0];
      const diffX = t.clientX - touchStartX;
      const diffY = t.clientY - touchStartY;
      const absX = Math.abs(diffX);
      const absY = Math.abs(diffY);

      if (Math.max(absX, absY) < 18) return;

      if (absX > absY) {
        if (diffX > 0 && dx === 0) { dx = 1; dy = 0; }
        else if (diffX < 0 && dx === 0) { dx = -1; dy = 0; }
      } else {
        if (diffY > 0 && dy === 0) { dx = 0; dy = 1; }
        else if (diffY < 0 && dy === 0) { dx = 0; dy = -1; }
      }
      e.preventDefault();
    }, { passive: false });

    draw();
  </script>
</body>
</html>
